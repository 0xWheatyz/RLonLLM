[tasks.build]
description = "Build the Docker image"
run = "docker build -t ollama-qwen ."

[tasks.run]
description = "Run the Docker container"
depends = "build"
run = "docker run --rm -it -p 11434:11434 ollama-qwen"

[tasks.docker]
description = "Run the prompt-guided baseline"
run = "docker compose run --build --rm rl-trainer python3 main.py"

[tasks.grpo-qwen]
description = "GRPO training — Qwen2.5-Coder-1.5B"
run = "cd RL && python grpo_train.py --model qwen-1.5b"

[tasks.grpo-deepseek]
description = "GRPO training — DeepSeek-Coder-1.3B"
run = "cd RL && python grpo_train.py --model deepseek-1.3b"

[tasks.grpo-phi]
description = "GRPO training — Phi-3.5-mini (stretch goal)"
run = "cd RL && python grpo_train.py --model phi-3.5"

[tasks.grpo-all]
description = "Run GRPO on all primary models sequentially"
run = """
cd RL && \
python grpo_train.py --model qwen-1.5b && \
python grpo_train.py --model deepseek-1.3b
"""

[tasks.compare]
description = "Compare all model results"
run = "python visualize_results.py --compare"

[tasks.autoresearch]
description = "Launch Junie autoresearch loop (requires Ollama running)"
run = "./autoresearch/run.sh 50"

[tasks.prefetch]
description = "Pre-download HuggingFace models (run Friday night)"
run = """
huggingface-cli download Qwen/Qwen2.5-Coder-1.5B-Instruct && \
huggingface-cli download deepseek-ai/deepseek-coder-1.3b-instruct
"""
