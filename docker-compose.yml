services:
  ollama:
    build: 
      context: ./ollama
      dockerfile: Dockerfile
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  rl-trainer:
    build:
      context: .
      dockerfile: RL/Dockerfile
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - RESULTS_DIR=/app/results
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./results:/app/results

volumes:
  ollama_data:
