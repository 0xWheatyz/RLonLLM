services:
  grpo-trainer:
    build:
      context: .
      dockerfile: RL/Dockerfile
    environment:
      - MODEL_NAME=qwen-1.5b
      - RESULTS_DIR=/app/results
    volumes:
      - ./results:/app/results
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: python grpo_train.py --model ${MODEL_NAME:-qwen-1.5b}

volumes:
  huggingface_cache:
